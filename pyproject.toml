[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-sapiens-agentpy"
version = "0.1.0"
description = "Persistent local agents with configurable LLM flows"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agentpy = "agentpy.__main__:main"

[tool.setuptools]
packages = ["agentpy"]
py-modules = ["agentpy_codex", "agentpy_state"]
